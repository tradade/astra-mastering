name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Type-check tests
        run: pnpm exec tsc -p tsconfig.test.json
      - name: Unit tests
        run: pnpm test
      - name: Lint (errors only)
        run: pnpm exec eslint . --quiet

  publish:
    name: Publish to npm
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and for provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish if version is new
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "${PKG}@${VER}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VER" ]; then
            echo "${PKG}@${VER} is already published on npm — nothing to do."
            exit 0
          fi
          # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
          npm install -g npm@latest
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish --access public --provenance
